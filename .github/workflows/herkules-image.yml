# Fork-only: builds the image herkules deploys (tools/deploy/docker-compose.yml there).
# Upstream's docker.yml needs Docker Hub secrets and is disabled in this fork; this file
# has a distinct name so syncing the fork from arcboxlabs/larkstack never conflicts.
#
# Every push to main publishes ghcr.io/fantastic-octo-barnacle/larkstack:sha-<short> and
# :main (amd64 only, the HK VPS). herkules pins the image by digest, so a sync here
# changes nothing in production until herkules bumps the pin.

name: Herkules image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: herkules-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          push: true

      - run: echo "Pin in herkules → ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
